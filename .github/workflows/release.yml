name: Release GMHelper

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.1.0

      - name: Read addon version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          TOC_FILE="GMHelper.toc"

          if [[ ! -f "$TOC_FILE" ]]; then
            echo "GMHelper.toc was not found at repository root: $TOC_FILE"
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          VERSION="$(sed -nE 's/^## Version:[[:space:]]*(.+)$/\1/p' "$TOC_FILE" | head -n 1)"

          if [[ -z "$VERSION" ]]; then
            echo "Version was not found in $TOC_FILE"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Verify tag matches TOC version
        shell: bash
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TOC_VERSION="${{ steps.version.outputs.version }}"

          if [[ "$TAG_VERSION" != "$TOC_VERSION" ]]; then
            echo "Tag version ($TAG_VERSION) does not match TOC version ($TOC_VERSION)."
            exit 1
          fi

      - name: Build addon archive
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/GMHelper

          cp \
            GMHelper.toc \
            Core.lua \
            Permissions.lua \
            Debug.lua \
            UI.lua \
            dist/GMHelper/

          cd dist
          zip -r "GMHelper-${{ steps.version.outputs.version }}.zip" GMHelper

          echo "Created archive: dist/GMHelper-${{ steps.version.outputs.version }}.zip"
          unzip -l "GMHelper-${{ steps.version.outputs.version }}.zip"

      - name: Create GitHub Release and upload archive
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE_PATH: dist/GMHelper-${{ steps.version.outputs.version }}.zip
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const tag = process.env.RELEASE_TAG;
            const version = process.env.RELEASE_VERSION;
            const archivePath = process.env.ARCHIVE_PATH;

            const { owner, repo } = context.repo;

            const release = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: `GMHelper ${version}`,
              generate_release_notes: true,
              draft: false,
              prerelease: false,
            });

            const archive = fs.readFileSync(archivePath);

            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.data.id,
              name: `GMHelper-${version}.zip`,
              data: archive,
              headers: {
                'content-type': 'application/zip',
                'content-length': archive.length,
              },
            });

            core.info(`Release ${tag} created: ${release.data.html_url}`);
