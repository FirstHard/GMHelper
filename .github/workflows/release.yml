name: Release GMHelper

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find addon TOC and read version
        id: version
        shell: bash
        run: |
            TOC_FILE=$(find . -type f -name "GMHelper.toc" | head -n 1)

            if [ -z "$TOC_FILE" ]; then
            echo "GMHelper.toc was not found"
            echo "Repository structure:"
            find . -maxdepth 3 -type f | sort
            exit 1
            fi

            echo "Found TOC: $TOC_FILE"

            VERSION=$(grep -E '^## Version:' "$TOC_FILE" | sed 's/^## Version:[[:space:]]*//')

            if [ -z "$VERSION" ]; then
            echo "Version was not found in $TOC_FILE"
            exit 1
            fi

            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "toc_file=$TOC_FILE" >> "$GITHUB_OUTPUT"
            echo "Detected version: $VERSION"

      - name: Verify tag matches TOC version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TOC_VERSION="${{ steps.version.outputs.version }}"

          if [ "$TAG_VERSION" != "$TOC_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match TOC version ($TOC_VERSION)."
            exit 1
          fi

      - name: Create addon archive
        shell: bash
        run: |
            mkdir -p dist

            TOC_FILE="${{ steps.version.outputs.toc_file }}"
            ADDON_DIR=$(dirname "$TOC_FILE")

            echo "Addon directory: $ADDON_DIR"

            zip -r \
            "dist/GMHelper-${{ steps.version.outputs.version }}.zip" \
            "$ADDON_DIR"
      
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "${GITHUB_REF_NAME}" \
            "dist/GMHelper-${{ steps.version.outputs.version }}.zip" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "GMHelper ${{ steps.version.outputs.version }}" \
            --generate-notes